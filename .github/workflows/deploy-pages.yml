name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Установка зависимостей
        run: bun install --frozen-lockfile

      - name: Статическая сборка
        env:
          # Адрес сервера, принимающего заявки. Если переменная не задана,
          # форма на странице не сможет отправить заявку и покажет телефон.
          NEXT_PUBLIC_LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}
          BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build:static

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Загрузка артефакта
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
